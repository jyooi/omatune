# Generated by scripts/render.ts from docs/verification/device-checklist.yaml.
# Do not edit this file.
name: Device verification
description: Report a Device Checklist run on real hardware.
title: "[verification] "
body:
  - type: markdown
    attributes:
      value: |
        Run the Device Checklist on stock firmware after a Sync of the Verification Library.
        Attach SysInfo and SysInfoExtended from iPod_Control/Device on the Device.
        Use the GitHub attach control below the form.
  - type: input
    id: model_num_str
    attributes:
      label: "ModelNumStr"
      description: "Copy ModelNumStr from SysInfo on the Device."
    validations:
      required: true
  - type: input
    id: apple_model_number
    attributes:
      label: "Apple model number"
      description: "Apple model number from the Device or its retail box."
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: "Firmware"
      description: "Firmware version from Settings, About."
    validations:
      required: true
  - type: input
    id: filesystem
    attributes:
      label: "Filesystem"
      description: "Volume format of the Device, such as FAT32."
    validations:
      required: true
  - type: input
    id: host_os
    attributes:
      label: "Host OS"
      description: "Host operating system and version that ran omatune."
    validations:
      required: true
  - type: input
    id: omatune_version
    attributes:
      label: "omatune version"
      description: "omatune version or GitHub Release tag."
    validations:
      required: true
  - type: dropdown
    id: dc_01
    attributes:
      label: "DC-01: Eject after Sync, unplug, watch the Device"
      description: "Pass: Leaves the disconnect screen and shows the main menu; no restore prompt."
      options:
        - pass
        - fail
        - not applicable
    validations:
      required: true
  - type: dropdown
    id: dc_02
    attributes:
      label: "DC-02: Settings, About"
      description: "Pass: Songs count equals the count in the Sync report."
      options:
        - pass
        - fail
        - not applicable
    validations:
      required: true
  - type: dropdown
    id: dc_03
    attributes:
      label: "DC-03: Browse Artists, Albums, Songs"
      description: "Pass: Every artist and Album appears once under the album artist, Tracks in disc and track order."
      options:
        - pass
        - fail
        - not applicable
    validations:
      required: true
  - type: dropdown
    id: dc_04
    attributes:
      label: "DC-04: Play one mp3, one AAC m4a, one ALAC m4a to the end"
      description: "Pass: No skip or error; now-playing shows tagged title, artist, Album, duration."
      options:
        - pass
        - fail
        - not applicable
    validations:
      required: true
  - type: dropdown
    id: dc_05
    attributes:
      label: "DC-05: Now-playing on a Track with Artwork and on the one without"
      description: "Pass: Artwork on the first, placeholder on the second; Cover Flow matches. Not applicable for MINI_1, MINI_2. Cover Flow only on CLASSIC_1, CLASSIC_2, CLASSIC_3, NANO_3, NANO_4."
      options:
        - pass
        - fail
        - not applicable
    validations:
      required: true
  - type: dropdown
    id: dc_06
    attributes:
      label: "DC-06: Play the gapless pair across the boundary"
      description: "Pass: No audible gap or click. Not applicable for MINI_1, MINI_2, NANO_1. Also not applicable on VIDEO_1 and VIDEO_2 with firmware before gapless support."
      options:
        - pass
        - fail
        - not applicable
    validations:
      required: true
  - type: dropdown
    id: dc_07
    attributes:
      label: "DC-07: Play one Track to the end, rate another 4 stars, skip a third after 2 s, eject, run sync again"
      description: "Pass: Plan lists Play Counts pending. After Sync, play-data.json holds play count 1, rating 4, skip count 1."
      options:
        - pass
        - fail
        - not applicable
    validations:
      required: true
  - type: dropdown
    id: dc_08
    attributes:
      label: "DC-08: Remove one Album from the Selection, add one, Sync"
      description: "Pass: Device shows the new Album, no trace of the removed one."
      options:
        - pass
        - fail
        - not applicable
    validations:
      required: true
  - type: dropdown
    id: dc_09
    attributes:
      label: "DC-09: Reboot (Menu + Select), open Music"
      description: "Pass: Database loads with no rebuild delay; Songs count from DC-02 holds."
      options:
        - pass
        - fail
        - not applicable
    validations:
      required: true
  - type: textarea
    id: devices_json
    attributes:
      label: "devices --json"
      description: "Paste the full output of omatune devices --json."
      render: shell
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Attach SysInfo files from the Device.
        Copy SysInfo and SysInfoExtended from iPod_Control/Device on the mounted volume.
        Use the attach control below this form.
